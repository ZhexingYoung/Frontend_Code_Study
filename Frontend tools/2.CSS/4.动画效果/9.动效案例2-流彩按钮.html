<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>流彩按钮</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    a {
      text-decoration: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    .box {
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 10px;
      position: relative;
      width: 300px;
      height: 150px;
      margin: 200px auto;
    }

    .box::before {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      background-image: conic-gradient(transparent, transparent, transparent, rgb(1, 154, 214));
      animation: rotate 1s linear infinite;
      z-index: -1;
    }

    .box::after {
      content: '';
      position: absolute;
      border-radius: 10px;
      /* inset: 3px; 表示距离父元素的内边距3px */
      inset: 3px;
      background-color: #000;
      z-index: -1;
    }

    .content {
      font-size: 20px;
      color: #fff;
    }

    @keyframes rotate {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="box">
    <div class="content">英雄联盟</div>
  </div>

</body>

</html>
