<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>滚动盒子案例</title>

  <style>
    * {
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      background: color #c1c1c1;
    }

    .box {
      overflow: hidden;
      width: 1180px;
      border: 2px solid red;
      background-color: #ccc;
      margin: 100px auto;
    }

    .scroll {
      display: flex;
      animation: scroll 10s linear infinite;
    }

    .ad1 {
      display: grid;
      grid-template-columns: repeat(6, 180px);
      grid-template-rows: repeat(4, 90px);
      gap: 16px 20px;
      margin-right: 20px;
    }

    .ad2 {
      display: grid;
      grid-template-columns: repeat(6, 180px);
      grid-template-rows: repeat(4, 90px);
      gap: 16px 20px;
    }

    .scroll img {
      height: 90px;
      width: 180px;
      border-radius: 6px;
    }

    @keyframes scroll {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(-1200px);
      }
    }
  </style>
</head>

<body>
  <div class="box">
    <div class="scroll">
      <div class="ad1">
        <img src="./img/ad1.jpg" alt="">
        <img src="./img/ad2.jpg" alt="">
        <img src="./img/ad3.jpg" alt="">
