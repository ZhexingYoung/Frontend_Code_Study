<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>animation动画仿360官网效果</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      background: url(./img/bg.jpg) no-repeat center/cover;
      background-color: black;
    }

    .ball1 {
      position: absolute;
      left: 20%;
      top: 22%;
      width: 13%;
    }

    .ball2 {
      position: absolute;
      left: 60%;
      top: 50%;
      width: 22%;
    }

    .wx {
      position: absolute;
      left: 53%;
      top: 58%;
      width: 7%;
    }

    .ball1 {
      animation: ballmove 5s linear alternate infinite;
    }

    .ball2 {
      animation: ballmove 7s linear alternate infinite;
    }

    .wx {
      animation: wxrotate 30s linear infinite;
    }

    @keyframes ballmove {
      0% {
        transform: translateY(0);
      }

      100% {
        transform: translateY(-54px);
      }
    }

    @keyframes wxrotate {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <img src="./img/ball1.png" alt="" class="ball1">
  <img src="./img/ball2.png" alt="" class="ball2">
  <img src="./img/wx.png" alt="" class="wx">
</body>

</html>
