<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>圆角边框</title>
  <style>
    .raduis1 {
      width: 100px;
      height: 100px;
      background-color: pink;
      border-radius: 20px;
    }

    /* 胶囊按钮，左右圆角，上下直线，当原角的px等于盒子高度的一半时，就是胶囊按钮 */
    .raduis2 {
      width: 200px;
      height: 50px;
      background-color: skyblue;
      border-radius: 25px;
      border: 1px dashed grey;
    }

    /* 同理，原角原理对图片也有用 */
    .jia {
      border-radius: 50%;
      border: 2px dotted rgb(128, 7, 7);
    }

    /* 可以通过对四个角的radius设置，来实现半圆角边框，四个值顺序是顺时针方向：左上，右上，右下，左下 */
    .half-raduis {
      width: 50px;
      height: 150px;
      background-color: rgb(29, 255, 63);
      border-radius: 10px 0px 0px 10px;
      border: 1px solid grey;
      margin: 20px;
    }

    .half-raduis2 {
      width: 100px;
      height: 100px;
      background-color: rgb(159, 159, 159);
      border-radius: 15px 0px 15px 0px;
      border: 2px solid rgba(21, 189, 255, 0.875);
    }

    .half-raduis3 {
      width: 300px;
      height: 50px;
      color: white;
      background-color: rgb(255, 72, 0);
      text-align: center;
      font-size: 30px;
      line-height: 50px;
      border-radius: 25px 25px 25px 3px;
      border: 1px solid grey;
      margin: 20px;
    }
  </style>
</head>

<body>
  <div class="raduis1">圆角边框</div>
  <div class="raduis2">胶囊按钮</div>
  <img src="./img/w1.webp" class="jia" alt="圆形装备">
  <div class="half-raduis">半圆角边框</div>
  <img src="./img/w3.webp" class="half-raduis2" alt="半圆角边框">
  <div class="half-raduis3">用清单采购更高效</div>
</body>

</html>
