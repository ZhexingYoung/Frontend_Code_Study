<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>盒子阴影效果</title>
  <style>
    /* 样式初始化 */
    * {
      margin: 0;
      /* 清除所有元素margin */
      padding: 0;
      /* 清除所有元素padding */
      box-sizing: border-box;
      /* 推荐同时设置盒模型 */
    }

    /* 重置列表样式 */
    ul,
    ol {
      list-style: none;
    }

    /* 重置链接样式 */
    a {
      text-decoration: none;
      color: inherit;
    }

    /* 重置表单样式 */
    input,
    textarea,
    button {
      border: none;
      outline: none;
    }

    /* 在中大型项目中，一般引用了normalize.css，这个文件是用于统一浏览器样式，所以不需要再重置样式 */

    .box1 {
      width: 200px;
      height: 200px;
      margin: auto;
      background-color: rgba(255, 255, 255, 1);
      border: 1px solid rgb(230, 230, 230);
      transition: all .3s;
      /* 过度写到盒子上，all:所有属性都过渡, .3s:过渡时间 */
    }

    .box1:hover {
      width: 220px;
      height: 220px;
      /* 盒子阴影效果：x轴偏移量 y轴偏移量 模糊程度 扩散距离 -inset:内阴影(默认是外阴影) 阴影颜色 */
      box-shadow: 0px 0px 10px 3px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>

<body>
  <div class="box1">盒子阴影效果</div>
</body>

</html>
