  <link rel="stylesheet" href="../iconfont1/iconfont.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }



    ul,
    ol,
    li,
    a {
      list-style: none;
      text-decoration: none;
      color: #1f1f1f;
    }

    .service {
      width: 256px;
      height: 400px;
      background-color: #f7f7f7;
      color: #1f1f1f;
      border-radius: 12px;
      margin: 50px auto;
      padding-top: 5px;
    }

    .service-title {
      text-align: left;
      font-size: 16px;
      font-weight: 600;
      line-height: 32px;
      padding-left: 16px;
      padding-top: 8px;
    }

    .service-title img {
      height: 20px;
      width: 60px;
      margin-left: 5px;
    }

    .service-list li {
      height: 32px;
      line-height: 32px;
      margin: 0px 8px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: normal;
      transition: all .5s;
      padding-left: 10px;
    }

    .service-list li:hover {
      background-color: #ffffff;
    }

    .service-list li a {
      font-size: 14px;
      transition: all, .3s;
    }

    .service-list li a:hover,
    .service-list li i:hover {
      color: #ff5000;
    }

    /* 第一行红色 */
    .service-list li:first-child i,
    .service-list li:first-child a {
      color: #ff5000;
    }
  </style>
</head>
