<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>内边距设置</title>
  <style>
    .box1 {
      width: 200px;
      height: 200px;
      background-color: pink;
      /* padding: 10px; 一个值代表四个方向的值 */
      /* 上 左右 下 padding: 10px 20px 30px;*/
      padding: 10px 20px 30px 50px;
    }

    .title {
      width: 240px;
      height: 40px;
      border: 1px solid gray;
      border-top: 3px solid orange;
      line-height: 40px;
      padding-left: 10px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="box1">内边距设置:一个值代表四个方向的边距，两个值代表上下和左右，三个值代表上，左右和下，四个值代表上，右，下，左</div>
  <div class="title">标题</div>
</body>

</html>
