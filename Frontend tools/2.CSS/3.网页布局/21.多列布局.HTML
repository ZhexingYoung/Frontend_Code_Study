<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多列布局</title>
</head>
<style>
  * {
    margin: 0;
    padding: 0;
  }

  .box {
    margin: 0 auto;
    border: 1px solid red;
    max-width: 1200px;
    column-count: 4;
    column-gap: 20px;
    column-rule: 1px dashed red;
  }

  .box .item {
    height: 150px;
    background-color: pink;
    margin-bottom: 20px;
    break-inside: avoid-column;
  }

  .box .item:nth-child(4n) {
    height: 300px;
  }
</style>

<body>
  <div class="box">
    <div class="item">
    </div>
    <div class="item">
    </div>
    <div class="item">
    </div>
    <div class="item">
    </div>
    <div class="item">
    </div>
    <div class="item">
    </div>
    <div class="item">
    </div>
    <div class="item">
    </div>
    <div class="item">
    </div>
    <div class="item">
    </div>
    <div class="item">
    </div>
    <div class="item">
    </div>
    <div class="item">
    </div>
    <div class="item">
    </div>
    <div class="item">
    </div>
    <div class="item">
    </div>
    <div class="item">
    </div>
    <div class="item">
    </div>
    <div class="item">
    </div>
    <div class="item">
    </div>
    <div class="item">
    </div>
  </div>
</body>

</html>
