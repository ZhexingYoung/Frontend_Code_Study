  <title>弹性布局瀑布流图片</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  .col-flex {
    display: flex;
    gap: 16px;
    width: 1180px;
    /* border: 1px solid red; */
    margin: 20px auto;
  }

  .col-flex .item {
    flex: 1;
    overflow-y: auto;
    height: 1000px;
  }

  .col-flex .item a {
    display: block;
    width: 100%;
    border-radius: 18px;
    overflow: hidden;
    margin-bottom: 15px;
  }

  .col-flex .item a img {
    width: 100%;
    /* 解决图片插入底部空白缝隙的问题 */
    /*1. 图片设置为块级元素 */
    display: block;
    /*2. 设置图片对齐方式不是基线对齐 */
    /* vertical-align: top; */
    /* vertical-align也可以用于垂直居中效果 */
  }
</style>
