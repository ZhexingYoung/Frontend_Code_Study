<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网格布局-网格线跨行</title>
</head>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  .box {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-gap: 10px;
    max-width: 1200px;
    margin: 100px auto;
    border: 1px solid red;
  }

  .box .item {
    height: 120px;
    background-color: pink;
    border-radius: 10px;
  }

  .box .item:nth-child(1) {
    grid-column: 1/ span 2;
    grid-row: 1/ span 2;
    height: auto;
  }
</style>

<body>
  <div class="box">
    <div class="item">
    </div>
    <div class="item">
    </div>
    <div class="item">
    </div>
    <div class="item">
    </div>
    <div class="item">
    </div>
    <div class="item">
    </div>
    <div class="item">
    </div>
    <div class="item">
    </div>
    <div class="item">
    </div>
    <div class="item">
    </div>
    <div class="item">
    </div>
    <div class="item">
    </div>

  </div>
</body>

</html>
