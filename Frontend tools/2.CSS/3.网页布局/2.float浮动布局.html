<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>float浮动布局</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    .main {
      overflow: hidden;
      /* 解决浮动塌陷问题 */
      width: 300px;
      border: 1px solid red;
      margin: 0 auto;
      /* height: 100px; */
    }

    .main .son1 {
      float: left;
      width: 100px;
      height: 100px;
      background-color: pink;
    }

    .main .son2 {
      float: left;
      width: 100px;
      height: 100px;
      background-color: skyblue;
    }

    .footer {
      width: 500px;
      height: 100px;
      background-color: black;
      margin: 0 auto;
    }

    .box {
      width: 600px;
      height: 500px;
      border: 1px solid red;
      margin: 0 auto;
    }

    a,
    ul,
    li,
    ol {
      list-style: none;
      text-decoration: none;
      color: #1f1f1f;
    }

    .box li {
      /* 添加浮动效果 */
      /* 注意：浮动会脱离文档流，所以父级盒子不会包裹浮动元素 */
      margin-right: 15px;
      float: left;
      width: 190px;
      height: 200px;
      margin-bottom: 15px;
    }

    .box li:nth-child(even) {
      background-color: pink;
    }

    .box li:nth-child(odd) {
      background-color: skyblue;
    }

    .box li:nth-child(3n) {
      margin-right: 0;
    }

    /* 额外标签法 */
    /* .clear {
      clear: both;
    } */

    /* 清除浮动单伪元素方法 */
    /* .clearfix::after {
      content: '';
      display: block;
      clear: both;
    } */

    /* 清除浮动双伪元素方法 */
    /* .clearfix:after,
    .clearfix:before {
      content: " ";
      display: table
    }

    .clearfix:after {
      clear: both
    } */
  </style>


</head>

<body>
  <ul class="box">
    <li>第一个盒子</li>
    <li>第二个盒子</li>
    <li>第三个盒子</li>
    <li>第四个盒子</li>
    <li>第五个盒子</li>
    <li>第六个盒子</li>
  </ul>

  <div class="main clearfix">
    <div class="son1"></div>
    <div class="son2"></div>
    <!--  额外标签法。 添加一个块级盒子 -->
    <!-- <div class="clear"></div> -->
  </div>
  <div class="footer"></div>
</body>

</html>
