<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>display显示模式转化</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    a,
    li,
    ul,
    ol {
      list-style: none;
      text-decoration: none;
      color: #1f1f1f;

    }

    .subbar {
      width: 234px;
      height: 460px;
      background-color: #9d9d9d;
      margin: 100px auto;
      font-size: 14px;
    }

    .subbar ul {
      padding: 30px 0 30px 0;
    }

    .subbar ul li a {
      /* 把链接转换为块级元素 */
      display: block;
      /* background-color: #ff6700; */
      color: #fff;
      height: 42px;
      line-height: 42px;
      padding-left: 20px;
    }

    .subbar ul li:hover {
      background-color: #ff6700;
    }

    .list {
      width: 400px;
      height: 400px;
      border: 1px solid red;
      margin: 0 auto;
    }

    .list a {
      /* 转换为行内块元素，这样就可以让li变成一行 */
      display: inline-block;
      height: 30px;
      line-height: 30px;
      background-color: #ccc;
      color: #fff;
      border-radius: 5px;
      font-size: 12px;
      padding: 0 10px;
      margin: 4px;
      /* 注意事项：a标签是行内元素，所以不能设置宽度和高度，但是可以设置行高和padding，margin */
      /* 行内块元素中间有空白间隙，是因为行内块元素的默认对齐方式是基线对齐，可以通过vertical-align: middle; 垂直居中对齐，也可以给父元素的字号font-size改成0*/

      /* 实际开发适合于对间距要求不高的情况进行使用 */
      /* 如果对间距要求高，可以使用flex布局 */
      /* flex布局是一种更强大的布局方式，可以更方便地控制布局 */

    }
  </style>
</head>

<body>
  <div class="subbar">
    <ul>
      <li><a href="#">手机</a></li>
      <li><a href="#">电视</a></li>
      <li><a href="#">平板</a></li>
      <li><a href="#">笔记本</a></li>
      <li><a href="#">家电</a></li>
      <li><a href="#">生活周边</a></li>
      <li><a href="#">智能穿戴</a></li>
      <li><a href="#">手机配件</a></li>
      <li><a href="#">更多</a></li>
    </ul>
  </div>

  <div class="list">
    <a href="#">大好山河</a>
    <a href="#">风花雪月</a>
    <a href="#">诗和远方</a>
    <a href="#">诗情画意</a>
    <a href="#">人间烟火</a>
  </div>
</body>

</html>
