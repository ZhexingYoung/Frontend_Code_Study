<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网格布局-网格填充方式</title>
</head>
<style>
  * {
    margin: 0;
    padding: 0;
  }

  .box {
    display: grid;
    grid-auto-flow: column;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    grid-gap: 15px;
    max-width: 1760px;
    height: 900px;
    margin: 100px auto;

    border-radius: 20px;
  }

  .box .item {
    overflow: hidden;
    background-color: pink;
    border-radius: 20px;
  }

  .box .item:nth-child(1) {
    grid-row: 1 /span 2;
  }

  .box .item:nth-child(3) {
    grid-column: 2 /span 2;
    grid-row: 2 /span 1;
  }

  img {
    display: block;
    height: 100%;
    width: 100%;
    object-fit: cover;
    object-position: center;
  }
</style>

<body>
  <div class="box">
    <div class="item">
      <img src="./img/tree1.jpg" alt="">
    </div>
    <div class="item">
      <img src="./img/tree2.jpg" alt="">
    </div>
    <div class="item">
      <img src="./img/tree3.jpg" alt="">
    </div>
    <div class="item">
      <img src="./img/tree4.jpg" alt="">
    </div>
  </div>
</body>

</html>
