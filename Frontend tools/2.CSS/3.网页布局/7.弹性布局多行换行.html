<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>弹性布局多行换行</title>
</head>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  .box {
    display: flex;
    flex-wrap: wrap;
    width: 80%;
    border: 1px solid red;
    margin: 0 auto;
  }

  .box .item {
    /* 1.方法一：使用flex属性 */
    flex-grow: 0;
    /* 不放大 */
    flex-shrink: 0;
    /* 不缩小 */
    flex-basis: calc(16.66666% - 16px);
    /* 基础宽度是一行的 1/6 减去 margin */

    /* 3.方法三：使用width属性 */
    /* width: calc(16.66666% - 16px); */
    /* 宽度是一行的 1/6 减去 margin */

    /* 2.方法二：使用max-width和min-width */
    max-width: calc(16.66666% - 16px);
    /* 最大宽度是一行的 1/6 减去 margin */
    min-width: calc(16.66666% - 16px);
    /* 最小宽度是一行的 1/6 减去 margin */
    height: 120px;
    background-color: pink;
    margin: 0 8px 16px;
    /* 上下外边距为16px，左右外边距为8px */
  }
</style>


<body>
  <div class="box">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item">4</div>
    <div class="item">5</div>
    <div class="item">6</div>
    <div class="item">7</div>
    <div class="item">8</div>
    <div class="item">9</div>
    <div class="item">10</div>
    <div class="item">11</div>
    <div class="item">12</div>
    <div class="item">13</div>
    <div class="item">14</div>
  </div>
</body>

</html>
