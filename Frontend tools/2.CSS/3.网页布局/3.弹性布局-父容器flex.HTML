<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>弹性布局</title>
  <style>
    .container {
      width: 800px;
      height: 600px;
      background-color: pink;
      /* justify-content: flex-start; 子元素左对齐 默认值*/
      /* justify-content: flex-end; 子元素右对齐*/
      /* justify-content: center; 子元素居中对齐*/
      /* justify-content: space-between; 子元素间距相等*/
      /* justify-content: space-around; 子元素间距相等，不包括两端*/
      /* justify-content: space-evenly; 子元素与边框间距相等，包括两端*/
      justify-content: space-evenly;
      /* 水平方向对齐方式 */

      align-items: center;
      /* 垂直方向对齐方式 */
      /* align-items: flex-start; 子元素顶部对齐*/
      /* align-items: flex-end; 子元素底部对齐*/
      /* align-items: center; 子元素居中对齐*/
      /* align-items: baseline; 子元素基线对齐*/
      /* align-items: stretch; 子元素拉伸对齐，默认值 需要子盒子没有高度*/
      /* align-items: space-between; 子元素间距相等*/
      /* align-items: space-around; 子元素间距相等，不包括两端*/
      /* align-items: space-evenly; 子元素与边框间距相等，包括两端*/

      display: flex;
      /*弹性布局 */
    }

    .item {
      height: 100px;
      width: 50px;
      /* width: 200px; 宽度大于盒子宽度时会自动压缩*/
      /* height: 200px; 不写高度，会自动适应内容高度 */
      /* 都不写时，会自动适应子盒子的内容宽度 */
      background-color: skyblue;
      border: 1px solid red;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item">4</div>
    <div class="item">5</div>
    <div class="item">6</div>
    <div class="item">7</div>
    <div class="item">8</div>
    <div class="item">9</div>
  </div>
</body>

</html>
