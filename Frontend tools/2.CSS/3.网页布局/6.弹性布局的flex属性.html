<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>弹性布局的flex属性</title>
</head>
<style>
  .box {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    border: 1px solid red;
  }

  .item {
    flex: 1;
    /* flex的完整写法是：flex: 1 1 20%;这三个值的意思是：
    第一个值的意思是：子元素的宽度为1，即在父元素中占据1个单位的空间，当容器有剩余空间时，这个元素可以扩张，占据剩余空间
    第二个值的意思是：子元素的宽度为1，缩放不会影响子元素的宽度，默认是1，当空间不够时，元素允许缩小。如果是0，则元素不允许缩小。
    第三个值的意思是：子元素的宽度为20%，即在父元素中占据20%的空间，当空间不够时，元素允许缩小。如果是0，则元素不允许缩小。*/
    width: 300px;
    height: 300px;
    border-radius: 10px;  }
</style>

<body>
  <div class="box">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item">4</div>
    <div class="item">5</div>
    <div class="item">6</div>
    <div class="item">7</div>
    <div class="item">8</div>
    <div class="item">9</div>
  </div>
</body>

</html>
