<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>定位布局-相对定位</title>
</head>
<style>
  .box {
    position: relative;
    top: 200px;
    left: 200px;
    width: 500px;
    height: 500px;
    background-color: pink;
    border: 1px solid red;
  }

  .box2 {
    width: 500px;
    height: 500px;
    background-color: skyblue;
  }
</style>

<body>
  <div class="box"></div>
  <div class="box2"></div>

</body>

</html>
