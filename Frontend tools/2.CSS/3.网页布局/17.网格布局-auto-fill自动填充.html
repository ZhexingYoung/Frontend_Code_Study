<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网格布局-auto-fill自动填充</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    a {
      text-decoration: none;
    }

    .box {

      margin: 20px auto;
      display: grid;
      /* 自动填充列数，最小宽度为210px，最大宽度为1fr（等比例分配剩余空间） */
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      /* 最大宽度为1200px，超出部分自动换行 */
      max-width: 1200px;
      grid-gap: 10px;
    }

    .box .video-item {
      width: 100%;
      height: 100%;
      position: relative;
      border-radius: 10px;
    }

    .box .video-item video {
      width: 100%;
      height: 100%;
      border-radius: 10px;
      display: block;
    }

    .box .video-item a {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 30px;
      line-height: 30px;
      z-index: 1;
      font-size: 14px;
      background-color: rgba(0, 0, 0, 0.3);
      color: #fff;
      border-radius: 10px;
      text-align: center;
    }

    .box .video-item a:hover {
      background-color: rgba(0, 0, 0, 0.8);
      transform: translateY(-2px);
      transition: all 0.3s ease-in-out;
    }
  </style>
</head>

<body>
  <div class="box">
