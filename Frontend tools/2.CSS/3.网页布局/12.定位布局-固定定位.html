<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <style>
    .box {
      position: fixed;
      bottom: 50px;
      left: calc(50% - 500px);
      /* margin: 0 auto; 对fixed定位无效 */
      width: 1000px;
      height: 200px;
      border-radius: 30px;
      background-color: rgba(0, 0, 0, 0.5);
    }
  </style>
</head>

<body>
  <div class="box">
    <div class="item"></div>
  </div>
</body>

</html>
