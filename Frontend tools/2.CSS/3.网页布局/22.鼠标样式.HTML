<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鼠标样式</title>
</head>
<style>
  * {
    margin: 0;
    padding: 0;
  }
</style>

<body>
  <ul>
    <li style="cursor: default;">默认鼠标样式 default</li>
    <li style="cursor: pointer;">指针鼠标样式 pointer</li>
    <li style="cursor: text;">文本鼠标样式 text</li>
    <li style="cursor: wait;">等待鼠标样式 wait</li>
    <li style="cursor: help;">帮助鼠标样式 help</li>
    <li style="cursor: move;">移动鼠标样式 move</li>
    <li style="cursor: not-allowed;">禁止鼠标样式 not-allowed</li>
    <li style="cursor: zoom-out;">放大鼠标样式 zoom-out</li>
    <li style="cursor: zoom-in;">缩小鼠标样式 zoom-in</li>

  </ul>
</body>

</html>
