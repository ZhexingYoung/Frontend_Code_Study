<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>弹性布局修主轴方向</title>
  <link rel="stylesheet" href="./iconfont/iconfont.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    ul,
    ol,
    li,
    a {
      list-style: none;
      text-decoration: none;
      color: #1f1f1f;
    }

    .iconfont {
      font-size: 30px;
    }

    .container {
      width: 200px;
      height: 100px;
      border: 1px solid red;
    }

    .container ul {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 100%;
      height: 100%;
    }

    .container li a {
      border: 1px solid blue;
      height: 100%;
      display: flex;
      /* 改变主轴方向为垂直方向 */
      flex-direction: column;
      justify-content: center;
      align-items: center;
      
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div class="container">
    <ul>
      <li>
        <a href="#">
          <i class="iconfont icon-dianzan"></i>
          <span>点赞</span>
        </a>
      </li>
      <li>
        <a href="#">
          <i class="iconfont icon-yingbi"></i>
          <span>投币</span>
        </a>
      </li>
      <li>
        <a href="#">
          <i class="iconfont icon-shoucang"></i>
          <span>收藏</span>
        </a>
      </li>

    </ul>
  </div>
</body>

</html>
