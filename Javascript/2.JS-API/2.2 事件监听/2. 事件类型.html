<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>事件类型</title>
</head>
<body>
  <script>
    // 1.鼠标事件
    // click：鼠标点击事件
    // mouseenter：鼠标移入事件
    // mouseleave：鼠标移出事件
    // mousemove：鼠标移动事件
    // mouseup：鼠标松开事件
    // mousedown：鼠标按下事件
 
//2.焦点事件
// focus：焦点事件
// blur：焦点事件

//3.键盘事件
// keydown：键盘按下事件
// keyup：键盘松开事件

//4.表单事件
// submit：表单提交事件
// reset：表单重置事件
// change：表单内容改变事件
// input：表单内容输入事件
// focus：表单焦点事件
// blur：表单焦点事件

  </script>
</body>
</html>
