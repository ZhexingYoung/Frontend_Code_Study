<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2.8 定时器的间歇函数</title>
</head>

<body>
  <!-- setInterval（函数，间隔时间） -->
  <!-- 作用：每隔一段时间触发这个函数， -->
  <script>
    setInterval(function () {
      console.log('一秒执行一次')
    }, 1000)

    //第二种写发：
    function fn() {
      console.log('一秒执行一次')
    }

    //!!!!注意⚠️ 这里fn不加小括号，加了会直接调用（只运行一次），而不加的话会1000ms自动调用一次fn
    setInterval(fn, 1000)
    let n = setInterval(fn, 1000)
    let m = setInterval(fn, 2000)
    // 定时器函数返回会返回编号，（因为一个页面可能有多个定时器）
    console.log(n)
    console.log(m)

    //关闭定时器⏲️
    //clearInterval (变量名)
    clearInterval(n)

    //重新开就是重新赋值，所以用let
    n = setInterval(fn, 1000)

  </script>
