<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>时间戳的使用</title>
</head>

<body>
  <script>
    // 1. 时间戳,是1970年1月1日00:00:00到当前时间的毫秒数
    // 1.1 获得当前时间戳getTime（）方法
    const date = new Date()
    const timestamp = date.getTime()
    console.log(timestamp)

    //1.2 +new Date() 方法
    const timestamp2 = +new Date()//把日期对象转换为时间戳，+会自动把字符串转换为数字
    console.log(timestamp2)
    //返回指定时间戳
    const timestamp3 = +new Date('2026-05-25 10:00:00')//返回指定时间戳
    console.log(timestamp3)

    //1.3 Date.now() 方法
    const timestamp4 = Date.now()
    console.log(timestamp4)

   
  </script>
</body>

</html>
