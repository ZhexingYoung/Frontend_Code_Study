<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日期对象实例化</title>
  <style>
    div {
      display: inline-block;
      height: 50px;
      line-height: 50px;
      padding: 0 10px;
      border: 1px solid grey;
    }
  </style>
</head>

<body>

  <div id="time"><span></span></div>

  <script>
    // 1. 日期对象实例化
    // 1.1 获得当前时间
    const date = new Date()
    console.log(date)

    //1.2 获得指定时间
    const date2 = new Date('2026-05-25 10:00:00')
    console.log(date2)

    //1.3 获得指定时间
    const date3 = new Date('2026-05-26 10:00:00')
    console.log(date3)

    // 2. 时间对象获取方法
    // 2.1 获得年份
    console.log(date.getFullYear())//获得四位年份

    //2.2 获得月份
    console.log(date.getMonth())//获得月份0-11，0表示1月，11表示12月

    //2.3 获得日期
    console.log(date.getDate())//获得日期1-31

    //2.4 获得星期
    console.log(date.getDay())//获得星期0-6，0表示星期日，6表示星期六

    //2.5 获得小时
    console.log(date.getHours())//获得小时0-23

    //练习模块：
    // 1. 获得当前时间，并显示在页面上
    function getTime() {
      const date4 = new Date()
      let y = date4.getFullYear()
      let m = date4.getMonth() + 1
      let d = date4.getDate()
      let h = date4.getHours()
      let min = date4.getMinutes()
      let s = date4.getSeconds()
      min = min < 10 ? '0' + min : min
      h = h < 10 ? '0' + h : h
      m = m < 10 ? '0' + m : m
      s = s < 10 ? '0' + s : s
      return `当前时间为${y}年${m}月${d}日${h}时${min}分${s}秒`
    }

    const timespan = document.querySelector('#time span')
    //先一开始给个gettime
    timespan.innerHTML = getTime()

    setInterval(function () {
      //每隔一秒更新一次
      timespan.innerHTML = getTime()
    }, 1000)

    //timespan.innerHTML = date.toLocaleString()
    //toLocaleString() 方法返回一个字符串，表示日期对象的本地化时间。 2026/5/25 10:00:00
    //toLocaleDateString() 方法返回一个字符串，表示日期对象的本地化日期。 2026/5/25
    //toLocaleTimeString() 方法返回一个字符串，表示日期对象的本地化时间。 10:00:00

  </script>
</body>

</html>
