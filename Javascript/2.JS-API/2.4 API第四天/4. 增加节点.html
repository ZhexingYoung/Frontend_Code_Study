<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4. 增加节点</title>
</head>

<body>
  <ul>
    <li>1</li>
    <li>2</li>
    <li>3</li>
    <li>4</li>
    <li>5</li>
  </ul>
  <script>
    // 1. 增加节点
    // 1.1 创建节点
    const li = document.createElement('li') //创建一个li元素
    const ul = document.querySelector('ul')
    li.innerHTML = '新增的节点' //设置li元素的内容
    ul.appendChild(li) //将li元素添加到ul元素中(追加到末尾)
    ul.insertBefore(li, ul.children[0]) //将li元素添加到ul元素中(插入到第一个子元素前面)

  </script>
</body>

</html>
