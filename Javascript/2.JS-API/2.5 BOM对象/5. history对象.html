<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>history对象</title>
</head>

<body>
  <script>
    //history对象是浏览器历史记录的栈，代表浏览器历史记录的栈，是JavaScript的顶级对象。
    console.log(history);
    //history对象的常用方法：
    //1.back() 后退
    history.back()
    //2.forward() 前进
    history.forward()
    //3.history.go() 前进后退
    history.go(1)//前进一步
    history.go(-1)//后退一步
    history.go(2)//前进两步
    history.go(-2)//后退两步
    history.go(0)//刷新当前页面

  </script>
</body>

</html>
