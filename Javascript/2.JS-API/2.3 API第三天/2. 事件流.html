<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>事件流</title>
</head>
<style>
  * {
    margin: 0;
    padding: 0;
  }

  .father {
    width: 500px;
    height: 500px;
    background-color: pink;
  }

  .son {
    width: 200px;
    height: 200px;
    background-color: purple;
  }
</style>

<body>
  <div class="father">
    <div class="son"></div>
  </div>
  <script>
    // 事件流是指事件从发生到被处理的过程
    // 事件流包括三个阶段：捕获阶段、目标阶段、冒泡阶段
    // 捕获阶段：事件从最外层元素开始，逐级向下传递
    // 比如点击一个按钮，事件流会从Document，html，body开始，逐级向下传递，直到按钮被点击

    // 目标阶段：事件到达目标元素

    // 冒泡阶段：事件从目标元素开始，逐级向上传递
    // 比如点击一个按钮，事件流会从按钮开始，逐级向上传递


    const fa = document.querySelector('.father')
    const son = document.querySelector('.son')
    // 山东  济南  蓝翔   目标（pink老师）  捕获阶段
    //  蓝翔  济南   山东   冒泡阶段

    //捕获阶段：
    // document.addEventListener('click', function () {
    //   alert('我是爷爷')
    // }, true)
    // fa.addEventListener('click', function () {
    //   alert('我是爸爸')
    // }, true)
    // son.addEventListener('click', function () {
    //   alert('我是儿子')
    // }, true)

    // 冒泡阶段：
    // 指的是：事件从目标元素开始，会依次向上调用所有父级元素的同名事件，这里是“click”
    // (去掉ture，默认是false)
    document.addEventListener('click', function () {
      alert('我是爷爷')
    })
    fa.addEventListener('click', function () {
      alert('我是爸爸')
    })
    son.addEventListener('click', function () {
      alert('我是儿子')
    })

    //阻止冒泡：把事件限制到当前元素内. 阻止流动，冒泡和捕获都能阻止。
    //事件对象.stopPropagation()
    son.addEventListener('click', function (e) {
      e.stopPropagation()
      alert('我是儿子')
    })

 
  </script>
</body>

</html>
