<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tab栏切换</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    .tab {
      width: 590px;
      height: 340px;
      margin: 20px;
      border: 1px solid #e4e4e4;
    }

    .tab-nav {
      width: 100%;
      height: 60px;
      line-height: 60px;
      display: flex;
      justify-content: space-between;
    }

    .tab-nav h3 {
      font-size: 24px;
      font-weight: normal;
      margin-left: 20px;
    }

    .tab-nav ul {
      list-style: none;
      display: flex;
      justify-content: flex-end;
    }

    .tab-nav ul li {
      margin: 0 20px;
      font-size: 14px;
    }

    .tab-nav ul li a {
      text-decoration: none;
      border-bottom: 2px solid transparent;
      color: #333;
    }

    .tab-nav ul li a.active {
      border-color: #e1251b;
      color: #e1251b;
    }

    .tab-content {
      padding: 0 16px;
    }

    .tab-content .item {
      display: none;
    }

    .tab-content .item.active {
      display: block;
    }
  </style>
</head>

<body>
  <div class="tab">
    <div class="tab-nav">
      <h3>每日特价</h3>
      <ul>
        <li><a class="active" href="javascript:;" data-id="0">精选</a></li>
        <li><a href="javascript:;" data-id="1">美食</a></li>
        <li><a href="javascript:;" data-id="2">百货</a></li>
        <li><a href="javascript:;" data-id="3">个护</a></li>
        <li><a href="javascript:;" data-id="4">预告</a></li>
      </ul>
    </div>
    <div class="tab-content">
      <div class="item active"><img src="../assets/tab00.png" alt="" /></div>
      <div class="item"><img src="../assets/tab01.png" alt="" /></div>
      <div class="item"><img src="../assets/tab02.png" alt="" /></div>
      <div class="item"><img src="../assets/tab03.png" alt="" /></div>
      <div class="item"><img src="../assets/tab04.png" alt="" /></div>
    </div>
  </div>
  <script>

    //事件委托，给ul标签添加鼠标移入事件
    const ul = document.querySelector('.tab-nav ul')
    //第二张方法的前置：
    const list = document.querySelectorAll('.tab-content .item')

    ul.addEventListener('click', function (e) {
      //console.log(e.target.tagName);//打印一下点击到的元素的标签名,
      if (e.target.tagName === 'A') {
        document.querySelector('.tab-nav .active').classList.remove('active')
        //当前元素添加active类名 this指向函数调用者ul
        e.target.classList.add('active')

        
        //先获取当前元素的data-id属性
        const i = +e.target.dataset.id; //+号将字符串转换为数字

        //第一个办法：然后选择对应的item，然后添加active类名，因为item是从1开始的，所以需要加1
        document.querySelector('.tab-content .active').classList.remove('active')
        // document.querySelector(`.tab-content .item:nth-child(${i + 1})`).classList.add('active')

        //第二个办法： 选择list组然后用i来定位索引号
        list[i].classList.add('active')
      }
    })

    //选择div的时候可以考虑自定义属性data-index，然后通过dataset.index 获取索引号

  </script>
</body>

</html>
