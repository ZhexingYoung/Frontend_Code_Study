<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自定义属性</title>
</head>

<body>
  <!-- data是自己加的自定义属性 -->
  <div data-id='1' data-spm='我也不知道' data-num='8'>1</div>
  <div data-id='2'>2</div>
  <div data-id='3'>3</div>
  <div data-id='4'>4</div>
  <div data-id='5'>5</div>

  <script>
    const one = document.querySelector('div')
    console.log(one.dataset)//会得到一个 所有data的有关的属性 {id: '1', spm: '我也不知道', num: '8'}
    //或者
    console.log(one.dataset.id)
  </script>
</body>

</html>
