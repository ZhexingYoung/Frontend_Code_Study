  <!-- 练习案例：修改DOM对象的内容 -->
  <div class="box2">
    <strong>年会抽奖</strong>
    <h1>一等奖：<span id="first">???</span></h1>
    <h2>二等奖：<span id="second">???</span></h2>
    <h3>三等奖：<span id="third">???</span></h3>
  </div>
  <Script>
    const arrName = ['刘德华', '张学友', '郭富城', '黎明'];

    function getRandom(N, M) {
      return Math.floor(Math.random() * (M - N + 1) + N);
    }

    let random = getRandom(0, arrName.length - 1);
    document.querySelector(`#first`).innerText = arrName[random];
    arrName.splice(random, 1);
    console.log(arrName);

    random = getRandom(0, arrName.length - 1);
    document.querySelector(`#second`).innerText = arrName[random];
    arrName.splice(random, 1);
    console.log(arrName);

    random = getRandom(0, arrName.length - 1);
    document.querySelector(`#third`).innerText = arrName[random];
    arrName.splice(random, 1);
    console.log(arrName);

  </script>
</body>
