<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS数据类型</title>
</head>

<body>
  <script>
    // 1.数据类型
    // 1.1 数据类型的概念
    // 数据类型是指数据的种类，比如数字，字符串，布尔值，对象，数组，函数等。
    // 数据类型的分类：
    // 基本数据类型：number，string，boolean，null，undefined，symbol
    // 引用数据类型：object
    // 特殊数据类型：function

    // A.Number 数字类型
    // 整数，小数，正数，负数，0 都是数字类型。

    // 算数运算符
    // + 加法 - 减法 * 乘法 / 除法 % 取余 ** 幂运算 ++ 自增 -- 自减
    // console.log(10 + 10);
    // console.log(10 - 10);
    // console.log(10 * 10);
    // console.log(10 / 10);
    // console.log(10 % 3);//结果为1，取余数
    // console.log(2 % 3);//结果为2，取余数
    // console.log(10 ** 10);//结果为10000000000
    // console.log(10 ++);//结果 为11
    // console.log(10 --);//结果为9
    // 乘除，取余优先级相同，加减优先级相同。

    // 练习案例 
    let num = prompt('请输入一个半径，');
    document.write(num * num * 3.14);

    //特殊值NaN
    // NaN全称Not a Number，表示不是一个数字。
    console.log('pink' - 2);//结果为NaN
    console.log(NaN + 2);//结果为NaN,

  </script>
</body>

</html>
