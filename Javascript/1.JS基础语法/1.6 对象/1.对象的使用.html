<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>对象的使用</title>
</head>

<body>
  <script>
    //1.对象（object）是一种数据类型，是一种复合数据类型，无序的数据集合。
    //声明方法
    let obj = {
      // 属性名:属性值,
      // 方法名:函数
    }
    let obj2 = new Object(
      {
        uname: '张三',
        age: 18,
        gender: '男'
      }
    )

    //也可以对象里面嵌套对象
    let obj3 = {
      name: BillEvans,
      age: 65,
      instrument: 'piano',
      style: 'coolJazz',
      albums: [
        {
          name: 'BillEvansLiveAtTheVillageVanguard',
          year: 1961
        }
      ]

    }
  </script>
</body>

</html>
