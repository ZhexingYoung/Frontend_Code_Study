<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>对象的方法</title>
</head>

<body>
  <script>
    //1.对象的方法
    //声明对象
    let obj = {
      uname: '张三',
      age: 18,
      gender: '男',
      //方法
      song: function (x = 0, y = 0) {
        console.log(x + y); 
      }
    }
 
    //方法调用
    obj.song(1, 2);



  </script>
</body>

</html>
