<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 1.更新变量
    // 1.1 声明变量并赋值
    let age = 18;
    // 1.2 更新变量
    age = 20;
    // 1.3 输出变量
    console.log(age);

    //  2.同时声明多个变量并赋值
    let num = 10, uname = '张三';
    console.log(num, uname);
    // 为了更好的可读性，一行写一个最好

    // 练习模块1: 弹出用户的输入内容
    let name;
    name = prompt('请输出你的内容');
    document.write(name);

    // 练习模块2: 
    let num1 = 10, num2 = 20;
    let temp = num1;
    num1 = num2;
    num2 = temp;
    console.log(num1, num2);

  </script>
</body>

</html>
