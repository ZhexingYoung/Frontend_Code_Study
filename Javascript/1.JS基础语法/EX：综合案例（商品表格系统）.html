<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box {
      width: 75%;
      margin: 0 auto;
    }

    h2 {
      text-align: center;
    }

    table {
      margin: 0 auto;
      border-collapse: collapse;
      border-spacing: 0;
      border: 1px solid #000;
    }

    th,
    td {
      border: 1px solid #000;
      padding: 10px;
      text-align: center;
    }

    th {
      background-color: #999999;
    }

    tr {
      background-color: #ffffff;
    }
  </style>
</head>

<body>
  <div class="box">
    <h2>订单确认</h2>
  </div>
  <script>
    // 1. 获取用户输入的商品价格、数量、收货地址
    let price = +prompt('请输入商品价格');
    let num = +prompt('请输入商品数量');
    let address = prompt('请输入收货地址');

    // 2. 计算商品总价
    let total = price * num;

    // 3. 页面打印渲染
    document.write
      (`<table>
        <tr>
          <th>商品名称</th>
          <th>商品价格</th>
          <th>商品数量</th>
          <th>商品总价</th>
          <th>收货地址</th>
        </tr>
        <tr>
          <td>小米手机青春版</td>
          <td>${price}元</td>
          <td>${num}个</td>
          <td>${total}元</td>
          <td>${address}</td>
        </tr>
      </table>`);


  </script>

</body>



</html>
