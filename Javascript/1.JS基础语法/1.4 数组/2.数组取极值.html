<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数组取极值</title>
</head>

<body>
  <script>
    // 1.数组取极值
    // 1.1 取数组的最大值
    let arr1 = [2, 6, 1, 77, 52, 25, 7]
    let max = arr1[0];
    for (let i = 0; i < arr1.length; i++) {
      if (arr1[i] > max) {
        max = arr1[i];
      }
    }
    console.log(max);

    let arr2 = [2, 6, 1, 77, 52, 25, 7]
    let min = arr2[0]
    for (let i = 0; i < arr2.length; i++) {
      if (arr2[i] < min)
        min = arr2[i]
    }
    console.log(min);
  </script>
</body>

</html>
