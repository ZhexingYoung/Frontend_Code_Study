<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数组筛选添加</title>
</head>

<body>
  <script>
    let arr = [2, 0, 6, 1, 77, 0, 52, 0, 25, 7]
    let arr2 = []
    for (let i = 0; i < arr.length; i++) {
      if (arr[i] >= 10) {
        arr2.push(arr[i])
      }
    }
    console.log(arr2);
  </script>
</body>

</html>
