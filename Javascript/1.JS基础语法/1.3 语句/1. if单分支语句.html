<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>if单分支语句</title>

</head>

<body>
  <script>
    // 1.判断语句
    // 1.1 if单分支语句
    // if (条件) {
    //   满足条件要执行的代码
    // }

    if (true) //里面无论写什么都会转换成boolean类型
    // 除了0，所有数字都是true
    // 除了'' 所有字符串都是true
    // 除了null undefined false 都是true

    {
      console.log('满足条件');
    } else {
      console.log('不满足条件');
    }
    // 练习案例
    let userId = prompt('请输入你的用户名');
    let userPassword = prompt('请输入你的密码');
    if (userId === 'pink' && userPassword === '123456') {
      alert('恭喜你登录成功');
    } else {
      alert('用户名或密码错误');
    }

  </script>
</body>

</html>
