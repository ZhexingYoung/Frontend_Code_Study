<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>while循环语句</title>
</head>

<body>
  <script>
    // 1. while循环语句
    //三要素: 初始化变量、终止条件、更新变量
    // 1.1 初始化变量
    let num = 0;
    // 1.2 判断终止条件 
    while (num < 10) {
      num++;
    }
    // 1.3 更新变量
    console.log(num);
    // 2. for循环语句
    // 3. do-循环语句


    // 练习模块1: print
    let str = '我要月薪过万';
    let num1 = 0;
    while (num1 < 10) {

      document.write(str + '<br>');
      num1++;
    }

  </script>
</body>

</html>
