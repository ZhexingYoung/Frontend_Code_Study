<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>赋值运算符</title>
</head>

<body>
  <script>
    // 赋值运算符：对变量进行赋值
    // 语法：变量名 = 值;需要左边是个变量，右边是个值
    let num = 1;
    // num = num + 1; （也可以写成num += 1;）
    num += 1;//这个的意思是num加1，再赋值给num 同理 num +=3的意思是num加3，再赋值给num
    console.log(num);

    // 减号运算符：-=
    num -= 1;//这个的意思是num减1，再赋值给num 同理 num -=3的意思是num减3，再赋值给num
    console.log(num);

    //其他预算运算符同理
    num *= 2;//这个的意思是num乘以2，再赋值给num 同理 num *=3的意思是num乘以3，再赋值给num
    console.log(num);
    num /= 2;//这个的意思是num除以2，再赋值给num 同理 num /=3的意思是num除以3，再赋值给num
    console.log(num);
    num %= 2;//这个的意思是num除以2的余数，再赋值给num 同理 num %=3的意思是num除以3的余数，再赋值给num
    console.log(num);

  </script>
</body>

</html>
