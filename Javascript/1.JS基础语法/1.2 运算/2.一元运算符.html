<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一元运算符</title>
</head>

<body>
  <script>
    // 一元运算符：
    // ++：对变量进行运算，将变量的值加1
    // --：对变量进行运算，将变量的值减1
    // ++num：先运算，再赋值
    // num++：先赋值，再运算
    // --num：先运算，再赋值
    // num--：先赋值，再运算


    // 语法：变量名 运算符
    // 1.先运算，再赋值,前置自增自减
    let num = 10;
    ++num;//这个的意思是num加1，再赋值给num 同理 num++3的意思是num加3，再赋值给num
    console.log(num);
    --num;//这个的意思是num减1，再赋值给num 同理 num--3的意思是num减3，再赋值给num
    console.log(num);

    // 2.先赋值，再运算,后置自增自减
    num = 10;
    num++;//这个的意思是num赋值给num，再加1 同理 num++3的意思是num赋值给num，再加3
    console.log(num);
    num--;//这个的意思是num赋值给num，再减1 同理 num--3的意思是num赋值给num，再减3
    console.log(num);

    //两个在运算层的区别
    let i = 1
    console.log(++i + 1);//3
    let q = 1
    console.log(q++ + 1);//2 后置自增自减是先赋值，再运算，所以q++的值是1，再加1，所以是2
    console.log(q);//2

    //案例练习
    let a = 1
    console.log(a++ + ++a + a);// 1+3+3=7
    console.log(a);//3



  </script>
</body>

</html>
