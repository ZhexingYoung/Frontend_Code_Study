<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS数组</title>
</head>

<body>
  <script>
    // 1.数组 array
    // 1.1 数组的概念
    // 数组是一个容器，可以用来存储多个数据，每个数据叫一个元素。
    let arr = ['张三', '李四', '王五', '赵六', '田七'];

    arr[0] = '猪八戒';//取数组arr里第一个元素，并赋值为'猪八戒'
    document.write(arr);

    // 1.2 数组的索引
    // 数组的索引是从0开始的（注意注意注意！！！！！），索引是数组中每个元素的编号，也叫下标。
    console.log(arr[0]);
    console.log(arr[1]);
    console.log(arr[2]);
    console.log(arr[3]);
    console.log(arr[4]);

    // 1.3 数组的长度
    console.log(arr.length);

    // 练习模块：
    let schedul = ['星期一', '星期二', '星期三', '星期四', '星期五', '星期六', '星期日'];
    document.write(schedul[6]);

  </script>
</body>

</html>
