<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS常量</title>

</head>

<body>
  <script>
    // 1.常量
    // 常量的意思是：常量是不可变的量，一旦定义，就不能再改变。
    // 常量的定义方式：const 常量名 = 值;
    const PI = 3.14
    console.log(PI)
    PI = 100
    console.log(PI) //报错  
    // 1.2 常量再次赋值后会报错

    // 1.3 声明常量的时候必须赋值
    // const PI2;
    // console.log(PI2) //报错

  </script>

</body>

</html>
